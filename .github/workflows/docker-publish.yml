name: Docker Build & Push (Mnemosyne OS)

# 触发条件：
# 1. push 到 main 分支且涉及 Docker 相关文件
# 2. 打 v* tag（推荐发版方式：git tag v6.0.0 && git push --tags）
# 3. 手动触发（Actions 页面 Run workflow 按钮）
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-publish.yml'
      - 'Mnemosyne Memory v5.1.4 20260814/mnemosyne.py'
      - 'Mnemosyne Memory v5.1.4 20260814/mcp_server.py'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 QEMU（多架构支持）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 提取版本号（tag 如 v6.0.0 → 6.0.0）
        id: meta
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="5.1.4"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tags=mnemosynoos/mnemosyne:${VERSION},mnemosynoos/mnemosyne:latest" >> "$GITHUB_OUTPUT"

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # 升版本时改这里（或直接用 tag 触发，自动取 tag 版本号）
          build-args: |
            SRC_DIR=Mnemosyne Memory v5.1.4 20260814
          cache-from: type=gha
          cache-to: type=gha,mode=max
